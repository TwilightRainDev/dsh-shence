<style>
:root{--paper:#f6efe2;--ink:#2a2622;--red:#a8322a;--dim:#8b8175;--line:#d9cdb8;--gold:#8a6a2f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light only}
html,body{margin:0;height:100%;-webkit-text-size-adjust:100%}
body{background:var(--paper)!important;color:var(--ink)!important;font-family:"Songti SC","Noto Serif CJK SC",serif;
 display:flex;justify-content:center;overflow-x:hidden}
#app{width:100%;max-width:520px;height:100dvh;display:flex;flex-direction:column;
 padding:calc(8px + env(safe-area-inset-top)) 10px calc(8px + env(safe-area-inset-bottom));gap:8px}
header{display:flex;flex-direction:column;gap:3px;border-bottom:1px solid var(--line);padding-bottom:6px}
h1{font-size:15px;margin:0;letter-spacing:.06em;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#date{font-size:12.5px;color:var(--red);letter-spacing:.04em}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chip{font-size:11px;color:var(--gold);border:1px solid var(--line);border-radius:20px;padding:2px 9px;background:#fffdf8;white-space:nowrap}
.chip:active{background:#f3e6df}
.chip.red{background:var(--red);color:#fff6ee;border-color:var(--red);font-weight:600}
.chip.red b{font-size:12px}
.stamp{border:1.5px solid var(--red);color:var(--red);border-radius:4px;padding:1px 6px;font-size:10px;
 letter-spacing:.08em;transform:rotate(-2deg);background:rgba(168,50,42,.05);white-space:nowrap;flex:none}
.stamp b{font-size:11px}
.stamp{touch-action:manipulation;position:relative}
.stamp:active{background:rgba(168,50,42,.15)}
#story{position:fixed;inset:0;display:none;background:#f6efe2;z-index:60;flex-direction:column;isolation:isolate}
body.story-on #app{display:none}
body.story-on{overflow:hidden}
#story.on{display:flex}
#story .top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid var(--line)}
#story .top b{font-size:14px;letter-spacing:.08em}
#story .top small{color:var(--gold);font-size:11px;letter-spacing:.06em}
#story .body{flex:1;overflow-y:auto;padding:16px 18px;font-size:14.5px;line-height:2.05;-webkit-overflow-scrolling:touch}
#story .body p{margin:0 0 12px;text-indent:2em}
#story .body p.h{text-indent:0;color:var(--red);font-size:12.5px;letter-spacing:.1em;margin-top:18px}
#story .body p.note{text-indent:0;color:var(--dim);font-size:12px;font-style:italic}
#story .foot{display:flex;gap:8px;padding:8px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}

#story .foot .exit{flex:.8;border-color:var(--line);color:var(--dim)}
.chip.rawbadge{background:#d2604f;color:#fff6ee;border-color:#d2604f;letter-spacing:.1em;font-weight:600}
#rawpane{display:none;flex:1;overflow-y:auto;background:#15120f;border:1px solid #3b332a;border-radius:8px;padding:10px;font-size:13px;line-height:1.72;-webkit-overflow-scrolling:touch}
#rawpane.on{display:block}
.rawbox{padding:0;margin:0;background:transparent;border:0}
.rawtitle{font-size:15px;letter-spacing:.32em;color:#d2604f;text-align:center;margin:2px 0 6px;font-weight:600}
.rawsub{font-size:10.5px;color:#8d8375;text-align:center;margin-bottom:8px;letter-spacing:.04em}
.rawbox .ln .x{color:#e6ddca}
.rawbox .ln .t{color:#c9a24a}
.rawbox .ln .c{color:#6d6455}
.rawbox .rawtip{color:#8d8375;font-size:10.5px;text-align:center;margin-top:8px;border-top:1px dashed #3b332a;padding-top:6px}
body.raw-on{background:#131110!important;color:#e8e0cf!important}
body.raw-on header{border-color:#3b332a}
body.raw-on h1,body.raw-on h1 small,body.raw-on #stats b{color:#e8e0cf}
body.raw-on h1 small{color:#8d8375}
body.raw-on #date{color:#d2604f}
body.raw-on #bar{background:#3b332a}
body.raw-on #log{background:#15120f;border-color:#3b332a;color:#cfc6b3}
body.raw-on #log .ln.day{color:#d2604f;border-color:#3b332a}
body.raw-on #log .ln.sys{color:#8d8375}
body.raw-on #stats div{background:#1a1714;border-color:#3b332a;color:#8d8375}
body.raw-on #stats b{color:#e8e0cf}

body.raw-on button.primary{background:#8f2f28;color:#f7ece0}

body.raw-on .chip.red{background:#8f2f28;color:#f7ece0;border-color:#8f2f28}

body.raw-on #pop{background:rgba(0,0,0,.66)}
body.raw-on .card{background:#15120f;border-color:#5a2a24;box-shadow:0 16px 40px rgba(0,0,0,.65)}
body.raw-on .card h3{color:#d2604f}
body.raw-on .card .body{color:#e6ddca}
body.raw-on .card .body em{color:#e8846f}
body.raw-on .card .body h4{color:#c9a24a}
body.raw-on .card .body p{color:#d8cfbc}
body.raw-on .card button{background:#1a1714;color:#d2604f;border-color:#5a2a24}
body.raw-on .card button:active{background:#241f1a}
body.raw-on .card button.ghost{background:transparent;color:#8d8375;border-color:#3b332a}
body.raw-on .bd{background:#1a1714;border-color:#3b332a;color:#7d7466}
body.raw-on .bd b{color:#7d7466}
body.raw-on .bd.on{background:#1f1310;border-color:#8f2f28;color:#e6ddca}
body.raw-on .bd.on b{color:#e8846f}
body.raw-on .bd span{color:#8d8375!important}
.rawtip{color:var(--dim);font-size:10.5px;font-style:italic;margin-bottom:4px}
.ln.raw .t{color:#b0742f}
.ln.case{color:#7a3b12}
.ln.case .t{color:var(--red)}
#badges{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bd{border:1px solid var(--line);border-radius:7px;padding:6px 7px;font-size:11px;color:#b3a894;line-height:1.4;background:#faf5ea}
.bd.on{border-color:var(--red);color:var(--ink);background:#fff6ef}
.bd b{display:block;font-size:12px;color:inherit;margin-bottom:2px}
.bd.on b{color:var(--red)}
.card button.ghost{background:transparent;color:var(--dim);border-color:var(--line);margin-top:6px}
#bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--red);transition:width .2s}
.statsbar{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:10.5px;color:var(--dim);margin:-2px 0 -2px}
.statsbar span{letter-spacing:.12em}
.progwrap{flex:1;min-width:0;overflow:hidden}
#progLabel{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
#progBar{height:2px;background:var(--line);border-radius:1px;overflow:hidden;margin-top:4px;display:none}
#progBar i{display:block;height:100%;width:0;background:var(--red);transition:width .3s}
#progBar.on{display:block}
body.raw-on #progBar{background:#3b332a}
body.raw-on #progBar i{background:#d2604f}
.statsbar button{font-family:inherit;font-size:10.5px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);background:#fffdf8;color:var(--gold);line-height:1.6}

.ln .c{color:#b9ae9a;font-size:9.5px;flex:none}

.ln.sys{color:var(--dim);font-size:11.5px}
.ln.hot .x{color:var(--red)}
footer{display:grid;grid-template-columns:1.15fr 1fr 1fr .82fr .82fr;gap:5px}
button{font-family:inherit;font-size:12.5px;padding:10px 3px;border-radius:7px;border:1px solid var(--red);
 background:#fffdf8;color:var(--red);letter-spacing:.02em}

button.primary{background:var(--red);color:#fff8f0}

.card{background:var(--paper);border:1px solid var(--red);border-radius:12px;padding:16px 14px 12px;

看人打刀，未说话。", "n": 19}, {"s": "替何三铺子打一日铁，掌上磨出水泡；天未亮便起，扫院，煮粥，粥里放了少许盐；往旧案房取卷，管事说“被人借走了”，问是谁，答不出。", "n": 19}], "所见": [{"s": "河上结薄冰，艄公以篙破之，声如碎瓷；演武场上尘土未落，日头斜照，尘如金粉；雪落在刀鞘上，不化，积成一条白线。", "n": 13}, {"s": "旧案房里只有一盏灯，灯芯短了，光发红；渡船靠岸，船头撞在木桩上，一声闷响；私盐仓后的墙根下，有人用炭写了一个“冤”字。", "n": 13}, {"s": "演武场上尘土未落，日头斜照，尘如金粉；集上有卖炭者，肩挑两篓，吆喝声哑；檐下滴水，一滴一滴，滴在石上已成窝。", "n": 12}, {"s": "客栈檐下挂着一串红辣椒，风吹得转；雪落在刀鞘上，不化，积成一条白线；狱中有人唱曲，唱的是一支没人听得懂的调。", "n": 12}, {"s": "梅圃里一枝先开，开在背阴处，白得发冷；雪落在刀鞘上，不化，积成一条白线；渡船靠岸，船头撞在木桩上，一声闷响。", "n": 12}, {"s": "村塾窗纸破了一角，风进来，吹得书页乱翻；旧案房里只有一盏灯，灯芯短了，光发红；客栈檐下挂着一串红辣椒，风吹得转。", "n": 12}, {"s": "马道上有兵过，甲叶相击，声音沿着路传过来；村塾窗纸破了一角，风进来，吹得书页乱翻；檐下滴水，一滴一滴，滴在石上已成窝。", "n": 12}, {"s": "渡船靠岸，船头撞在木桩上，一声闷响；坟头上新土未干，插着一根木牌，字被雨泡糊了；山道上一具已朽的担架，绳子还系着。", "n": 11}, {"s": "私盐仓后的墙根下，有人用炭写了一个“冤”字；马道上有兵过，甲叶相击，声音沿着路传过来；狱中有人唱曲，唱的是一支没人听得懂的调。", "n": 11}, {"s": "梅圃里一枝先开，开在背阴处，白得发冷；河湾水浅，露出半截沉船的骨；马道上有兵过，甲叶相击，声音沿着路传过来。", "n": 11}, {"s": "檐下滴水，一滴一滴，滴在石上已成窝；狱中有人唱曲，唱的是一支没人听得懂的调；客栈檐下挂着一串红辣椒，风吹得转。", "n": 11}, {"s": "坟头上新土未干，插着一根木牌，字被雨泡糊了；马道上有兵过，甲叶相击，声音沿着路传过来；集上有卖炭者，肩挑两篓，吆喝声哑。", "n": 11}, {"s": "河上结薄冰，艄公以篙破之，声如碎瓷；私盐仓后的墙根下，有人用炭写了一个“冤”字；雪落在刀鞘上，不化，积成一条白线。", "n": 11}, {"s": "演武场上尘土未落，日头斜照，尘如金粉；旧案房里只有一盏灯，灯芯短了，光发红；野店灶上炖着东西，香气很重，肉却少。", "n": 11}, {"s": "河湾水浅，露出半截沉船的骨；山道上一具已朽的担架，绳子还系着；雪落在刀鞘上，不化，积成一条白线。", "n": 11}, {"s": "城门口贴了新告示，看的人多，识字的人少；雪落在刀鞘上，不化，积成一条白线；檐下滴水，一滴一滴，滴在石上已成窝。", "n": 11}, {"s": "山道上一具已朽的担架，绳子还系着；河上结薄冰，艄公以篙破之，声如碎瓷；旧案房里只有一盏灯，灯芯短了，光发红。", "n": 10}, {"s": "檐下滴水，一滴一滴，滴在石上已成窝；旧案房里只有一盏灯，灯芯短了，光发红；河上结薄冰，艄公以篙破之，声如碎瓷。", "n": 10}], "问答": [{"s": "“你为何不问我是谁？”　“我问了你也不会说。”　“那你问什么？”　“问你为谁来。”", "n": 1880}, {"s": "“我劝你走。”　“走哪儿去？”　“走远些。”　“远不了，我这个人走到哪儿都带着我自己。”", "n": 1855}, {"s": "“刀放下。”　“你先放。”　“我数三。”　“数。”", "n": 1837}, {"s": "“你是哪里人？”　“渡口的。”　“渡口人多。”　“不多，只死剩一个。”", "n": 1836}, {"s": "“你还记得沈家渡么？”　“记得。”　“记得多少？”　“四十七个人，四十张脸。”", "n": 1822}, {"s": "“钱我不要。”　“那你要什么？”　“要一句话。”　“什么话？”　“你自己说。”", "n": 1798}, {"s": "“你恨他么？”　“恨。”　“为何不动手？”　“动了手，他便不必恨了。”", "n": 1794}, {"s": "“这事与你无关。”　“沾上了便有关。”", "n": 1789}, {"s": "“这么晚了还坐着？”　“等天亮。”　“天亮有什么好等的。”　“天亮好走路。”", "n": 1787}, {"s": "“你肯替他作证？”　“我肯。”　“他一文钱也没给你。”　“他给过我半块饼。”", "n": 1777}, {"s": "“你要去哪儿？”　“不知道。走到哪儿算哪儿。”", "n": 1767}, {"s": "“你这剑几斤？”　“七斤。”　“重了。”　“习惯了。”", "n": 1759}, {"s": "“听说你杀过人。”　“听说过的事，多半不是真的。”　“那真的呢？”　“真的没人说。”", "n": 1744}, {"s": "“这案子你翻不动。”　“那我便翻到你翻得动为止。”", "n": 1739}, {"s": "“你身上有伤。”　“不碍事。”　“会死人。”　“那就死。”", "n": 1726}], "事": [{"s": "是日寻到一处旧宅，门前石阶还是旧的。他在阶上坐了半个时辰，起身时衣上沾了土。", "n": 2030}, {"s": "与人争一件事，争到最后那人说：“你这人真冷。”他答：“我不冷，我只是先算过账。”那人便不争了。", "n": 1999}, {"s": "夜半听见水声，他便醒了，起来坐着，直到水声停了才躺下。此事每月总有几回。", "n": 1951}, {"s": "有人当街拦住他，要他偿命。他问：“谁家的？”那人答不上来。他便走了过去。", "n": 1870}, {"s": "街上有人认出他来，低声道：“断眉沈。”他未答，走得更快些。那人追了两步，终究没追。", "n": 1864}, {"s": "在集市听见有人唱《孤城记》，他站住了，听完一段才走。此后一日未说话。", "n": 634}, {"s": "在驿站听见有人唱《孤城记》，他站住了，听完一段才走。此后一日未说话。", "n": 598}, {"s": "在渡口听见有人唱《孤城记》，他站住了，听完一段才走。此后一日未说话。", "n": 593}, {"s": "村中有人办满月酒，他远远站着，未近前。", "n": 250}, {"s": "村中有人办满月酒，他帮了半日忙，未受席。", "n": 233}, {"s": "村中有妇人哭了一日，他送了一斗米。", "n": 226}, {"s": "村中有老者出殡，他送了一斗米。", "n": 223}, {"s": "村中有妇人哭了一日，他帮了半日忙，未受席。", "n": 213}, {"s": "村中有妇人哭了一日，他远远站着，未近前。", "n": 212}, {"s": "村中有老者出殡，他帮了半日忙，未受席。", "n": 210}, {"s": "是夜有人叩门。开门，门外无人，门槛上放一枚铜钱。他看了看，收了。此后半夜未睡。", "n": 200}, {"s": "村中有老者出殡，他远远站着，未近前。", "n": 196}, {"s": "是夜有人叩门。开门，门外无人，门槛上放一只空碗。他拾了起来，又放回去。此后半夜未睡。", "n": 191}], "记": [{"s": "夜里不必再擦刀，手上却仍旧每日做那个动作。做完了才想起来，刀已埋了。", "n": 2250}, {"s": "抄经抄到“无咎”二字，笔停了很久。这两个字是他自己取的字，取自“无咎者，善补过也”。", "n": 2245}, {"s": "追兵第一回来时他躲了，第二回躲了，第三回没躲，站在院中等人来。人没来，此后再无消息。", "n": 2235}, {"s": "梅圃里的梅不结果，只为看花。有人问他为何不种能吃的，他答：“能给的就这些。”", "n": 2195}, {"s": "村中教孩子识字，只教到十岁。十岁以后便要下地，多识的字会变成麻烦。", "n": 2181}, {"s": "村人不问其来历。此地从前死过很多人，活下来的人都不问。", "n": 2165}, {"s": "隐名之后最难的不是不说话，是听见别人骂“断眉沈”时不许接话。有一回差点接了。", "n": 2164}, {"s": "他偶尔想，若当年不走，今日会在何处。想一想便不再想，因为想了也无用，且会睡不着。", "n": 2115}, {"s": "人穷到极处，是不敢生病的。生了病只能等，等好，或者等死，两者差不多快。", "n": 378}, {"s": "讨饭最难的不是开口，是被人看了还要接着开口。开口三十次，总有一次成，这是老丐教的算术。", "n": 373}, {"s": "汴梁的冬天能冻死人。冻死的人先是缩成一团，后来反而伸开了。见了三回，便不再怕了。", "n": 367}, {"s": "阿六死那一日他在西城讨饭。回来时人已硬了，手里还握着半个饼。他把饼吃了，然后才哭。", "n": 367}, {"s": "有一年他攒了四十七文钱，藏于墙缝。第二日墙被人拆了，钱也没了。此后不再藏东西，全带在身上。", "n": 356}, {"s": "说书的说江湖人快意恩仇。他听着觉得好笑，因为他见过被恩仇快意掉的人，都是躺在街上的。", "n": 354}, {"s": "替人哭丧那回，他哭得比孝子还真。事后那人多给了他十文，说“你这一场，值”。他拿钱走了，夜里哭了半宿。", "n": 343}, {"s": "乞丐也分三六九等。城门口有地盘的，庙檐下有铺位的，河湾边搭棚的，各有各的规矩，坏了规矩便要挨打。", "n": 342}, {"s": "那时觉得镇上的人很多，后来才知道，一个镇子能记得住的脸不过几十张，其余的都是过路的。", "n": 269}, {"s": "有一年水大，渡了三天三夜，父亲的手泡得发白。那三日家里有肉吃，肉是别人给的。", "n": 265}], "夜记": [{"s": "他偶尔想，若当年不走，今日会在何处。想一想便不再想，因为想了也无用，且会睡不着。", "n": 2275}, {"s": "隐名之后最难的不是不说话，是听见别人骂“断眉沈”时不许接话。有一回差点接了。", "n": 2240}, {"s": "抄经抄到“无咎”二字，笔停了很久。这两个字是他自己取的字，取自“无咎者，善补过也”。", "n": 2237}, {"s": "村中教孩子识字，只教到十岁。十岁以后便要下地，多识的字会变成麻烦。", "n": 2173}, {"s": "梅圃里的梅不结果，只为看花。有人问他为何不种能吃的，他答：“能给的就这些。”", "n": 2169}, {"s": "夜里不必再擦刀，手上却仍旧每日做那个动作。做完了才想起来，刀已埋了。", "n": 2158}, {"s": "追兵第一回来时他躲了，第二回躲了，第三回没躲，站在院中等人来。人没来，此后再无消息。", "n": 2151}, {"s": "村人不问其来历。此地从前死过很多人，活下来的人都不问。", "n": 2147}, {"s": "讨饭最难的不是开口，是被人看了还要接着开口。开口三十次，总有一次成，这是老丐教的算术。", "n": 390}, {"s": "乞丐也分三六九等。城门口有地盘的，庙檐下有铺位的，河湾边搭棚的，各有各的规矩，坏了规矩便要挨打。", "n": 389}, {"s": "有一年他攒了四十七文钱，藏于墙缝。第二日墙被人拆了，钱也没了。此后不再藏东西，全带在身上。", "n": 377}, {"s": "说书的说江湖人快意恩仇。他听着觉得好笑，因为他见过被恩仇快意掉的人，都是躺在街上的。", "n": 364}, {"s": "人穷到极处，是不敢生病的。生了病只能等，等好，或者等死，两者差不多快。", "n": 358}, {"s": "阿六死那一日他在西城讨饭。回来时人已硬了，手里还握着半个饼。他把饼吃了，然后才哭。", "n": 350}, {"s": "汴梁的冬天能冻死人。冻死的人先是缩成一团，后来反而伸开了。见了三回，便不再怕了。", "n": 328}, {"s": "替人哭丧那回，他哭得比孝子还真。事后那人多给了他十文，说“你这一场，值”。他拿钱走了，夜里哭了半宿。", "n": 324}, {"s": "镇上私塾先生说他记性好，可惜出身不对。他不懂什么叫出身，只记得先生那句“可惜”。", "n": 281}, {"s": "母亲抚琴时不许人说话，说声音会混进去。此后他听人说话，总在听有无混进来的那一层。", "n": 267}], "琐记": [{"s": "抄了一张清单，写完又烧了；是日有雨，屋漏，以盆承之；洗了衣，晾于檐下。", "n": 31}, {"s": "数了钱，剩九十七文；是日焚旧纸一堆，火光很亮；替人写了半封信，末了不写了。", "n": 31}, {"s": "买膏药三张；是日有吏来问话，问了三句便走；把琴弦换了一根，弹了半曲。", "n": 29}, {"s": "将一枚铜钱穿孔，系于颈上；是日村中有人办丧，去帮了半日忙；把地契残片取出看了一下，又收回。", "n": 28}, {"s": "抄了一张清单，写完又烧了；是日所养之犬死，埋在梅树下；数了钱，剩九十七文。", "n": 26}, {"s": "修了鞋，用麻线；是日有孩童来讨字，写了一个“静”；买膏药三张。", "n": 25}, {"s": "数了钱，剩九十七文；是日得米二斗，分与邻家半斗；修了鞋，用麻线。", "n": 25}, {"s": "把刀鞘上的裂纹用蜡封了；是日无客；喂了路边的狗。", "n": 25}, {"s": "把地契残片取出看了一下，又收回；是日焚旧纸一堆，火光很亮；抄了一张清单，写完又烧了。", "n": 25}, {"s": "买膏药三张；是日未出门，读书半卷；把地契残片取出看了一下，又收 45}, {"s": "在渡口拾得一枚铜铃，无舌，摇之无声，与旧物一样。", "n": 1334}, {"s": "街角有人卖旧刀鞘，样式与自己的相同，问价，答“不卖”。", "n": 1329}, {"s": "夜里翻到一张旧图，图上标着沈家渡，只画了一半。", "n": 1324}, {"s": "有人在席上问：你后悔么？其答：后悔的事很多，但不包括那一件。", "n": 1320}, {"s": "村中有孩子问他：你杀过人么？他答：杀过。孩子便不再问。", "n": 1320}, {"s": "官道上见一队囚车，擦身而过，囚中有人抬头看了一眼。", "n": 1319}, {"s": "今日收到旧日同门的讣告，纸很薄，字是别人代写的。", "n": 1316}], "耳闻": [{"s": "城中捕了一个拐子，其供出的人名写满三张纸，三张纸上有一个名字与官册对得上。此说传了许久，无人能证。听说苏家女已嫁，嫁的是个做纸的，为人老实。", "n": 57}, {"s": "乡里传：今年水要发，故老太爷叫人先把祠里的牌位搬高了。又有人说不是这样。城中捕了一个拐子，其供出的人名写满三张纸，三张纸上有一个名字与官册对得上。", "n": 55}, {"s": "听说苏家女已嫁，嫁的是个做纸的，为人老实。又有人说不是这样。传闻天枢阁要废一部旧谱，阁中人不愿说，只摇头。", "n": 55}, {"s": "老陶病了一场，说是夜里吹了风，后生们替他摆了几日渡。说的人很多，信的人少。城中捕了一个拐子，其供出的人名写满三张纸，三张纸上有一个名字与官册对得上。", "n": 54}, {"s": "听说苏家女已嫁，嫁的是个做纸的，为人老实。说的人很多，信的人少。朝廷遣使北去，说是议边，去时车驾很盛，回时只一车。", "n": 54}, {"s": "漕帮与私盐贩子在城西打了一场，死了两个，官府记作“斗殴”。说的人很多，信的人少。朝廷遣使北去，说是议边，去时车驾很盛，回时只一车。", "n": 53}, {"s": "邻县有蝗，米价又涨，一斗已到八十文。又有人说不是这样。乡里传：今年水要发，故老太爷叫人先把祠里的牌位搬高了。", "n": 52}, {"s": "老陶病了一场，说是夜里吹了风，后生们替他摆了几日渡。又有人说不是这样。邻县有蝗，米价又涨，一斗已到八十文。", "n": 52}, {"s": "邻县有蝗，米价又涨，一斗已到八十文。此说传了许久，无人能证。漕帮与私盐贩子在城西打了一场，死了两个，官府记作“斗殴”。", "n": 51}, {"s": "有行商自西域回，说那边也打，打得更凶，死人堆成堆。说的人很多，信的人少。邻县有蝗，米价又涨，一斗已到八十文。", "n": 51}, {"s": "有行商自西域回，说那边也打，打得更凶，死人堆成堆。又有人说不是这样。城中捕了一个拐子，其供出的人名写满三张纸，三张纸上有一个名字与官册对得上。", "n": 50}, {"s": "漕帮与私盐贩子在城西打了一场，死了两个，官府记作“斗殴”。此说传了许久，无人能证。市上相传：雁门又增兵三千，粮草自凉州调，车马已发了七日。", "n": 50}, {"s": "城中捕了一个拐子，其供出的人名写满三张纸，三张纸上有一个名字与官册对得上。说的人很多，信的人少。传闻天枢阁要废一部旧谱，阁中人不愿说，只摇头。", "n": 50}, {"s": "朝廷遣使北去，说是议边，去时车驾很盛，回时只一车。此事无从考。老陶病了一场，说是夜里吹了风，后生们替他摆了几日渡。", "n": 50}, {"s": "市上相传：雁门又增兵三千，粮草自凉州调，车马已发了七日。说的人很多，信的人少。听说苏家女已嫁，嫁的是个做纸的，为人老实。", "n": 49}, {"s": "漕帮与私盐贩子在城西打了一场，死了两个，官府记作“斗殴”。说的人很多，信的人少。市上相传：雁门又增兵三千，粮草自凉州调，车马已发了七日。", "n": 49}, {"s": "有行商自西域回，说那边也打，打得更凶，死人堆成堆。此事无从考。市上相传：雁门又增兵三千，粮草自凉州调，车马已发了七日。", "n": 49}, {"s": "乡里传：今年水要发，故老太爷叫人先把祠里的牌位搬高了。又有人说不是这样。有行商自西域回，说那边也打，打得更凶，死人堆成堆。", "n": 49}], "梦": [{"s": "梦见自己在数铜钱，数到最后两枚是一样的，便醒了。", "n": 2040}, {"s": "梦见母亲抚琴，琴弦一根根断，断了仍在弹，弹到手指见血。", "n": 1994}, {"s": "梦见雁门的风停了，停得很突然，整座山静得不正常。", "n": 1990}, {"s": "梦见渡口的柳树倒了，   addLine('（存档已清空。永嘉十四年正月初一，四岁。）','sys')};
function roll(tag,quiet){
  const arr=POOL[tag];if(!arr)return;
  const e=pick(arr),txt=e.s;
  let k=null;
  if(/邻家失火/.test(txt))k='fire';
  else if(/要他偿命/.test(txt))k='kill';
  else if(/擦剑|擦刀/.test(txt))k='sword';
  else if(/梦见母亲/.test(txt))k='dream';
  else if(/梦见苏氏/.test(txt))k='su';
  else if(/无从考|无人能证/.test(txt))k='noka';
  else if(/讣告/.test(txt))k='obit';
  else if(/断眉沈/.test(txt))k='mei';
  else if(/左眉断处发痒/.test(txt))k='brow';
  else if(tag==='伤'&&!/^无伤/.test(txt))k='wound';
  else if(/拾了起来，又放回去/.test(txt))k='pick';
  else if(/所养之犬死/.test(txt))k='dog';
  else if(/找了半日/.test(txt))k='shoe';
  else if(/抄书至丑时/.test(txt))k='night';
  else if(/数至百二十/.test(txt))k='star';
  else if(/持刀立半刻/.test(txt))k='hold';
  else if(/推落水中/.test(txt))k='plash';
  else if(/你这剑几斤/.test(txt))k='ask';
  else if(/输了三子/.test(txt))k='chess';
  else if(/喂了路边的狗/.test(txt))k='feed';
  if(k)S[k]++;
  if(AGE>0&&AGE<8){
    for(const [re,name] of CHILD_BAN){
      if(re.test(txt)){S.anachro++;
        if(!quiet){
          line(tag,txt,e.n,true);
          addLine('〔穿越者〕他今年 '+num(AGE)+' 岁，在'+name+'。这不是一个 '+num(AGE)+' 岁孩子该做的事。','sys');
        }
        return;
      }
    }
  }
  if(!quiet)line(tag,txt,e.n,k&&k!=='wound');
}
function checkMile(){for(const [k,min,t,b] of MILE){const id='m'+k+min;if(S[k]>=min&&!fired[id]){fired[id]=1;sfx('gong');popup(t,b)}}
  save();renderAchi();}
function unlocked(m){return !!fired['m'+m[0]+m[1]]||S[m[0]]>=m[1]}
function renderAchi(){const n=MILE.filter(unlocked).length;
  document.getElementById('achi').textContent='成就 '+n+'/'+MILE.length}
function extras(dt,quiet){
  if(dt.age<=9&&Math.random()<.08){
    S.mei++;
    if(!quiet){
      line('事四','街上有人认出他来，低声道：“断眉沈。”他未答，走得更快些。',9668,true);
      addLine('（他今年 '+num(dt.age)+' 岁。那道眉要等到二十八岁才割。）','sys');
    }
  }
  if(dt.age<=8&&Math.random()<.45){S.plash++;if(!quiet)line('晨','被邻家子推落水中，自己爬上岸，不告父母。',820,1);}
  if(Math.random()<.15){S.ask++;if(!quiet)line('问答','“你这剑几斤？”　“七斤。”　“重了。”　“习惯了。”',7287,1);}
  if(Math.random()<.18){S.chess++;if(!quiet)line('晨','与村中老者下棋一局，输了三子。',8679,1);}
  if(Math.random()<.14){S.feed++;if(!quiet)line('琐记','喂了路边的狗。',3900,1);}
  if(dt.age>=10&&dt.age<=17){
    if(Math.random()<.45){S.kick++;if(!quiet)line('晨','沿街乞讨，被人踢了一脚，爬起来又去下一家。',1443,1);}
    if(Math.random()<.45){S.bun++;if(!quiet)line('晨二','与人争一个馒头，输了，蹲在墙根不说话。',1445,1);}
    if(Math.random()<.45&&!quiet)line('行止','偷了一个馍，被人追过三条街，还是吃了。',1482,1);
  }
  if(dt.age>=23&&dt.age<=27&&Math.random()<.13){S.ash++;if(!quiet)line('晨','在衙中吃冷饭，饭上有灰。',239,1);}
  if(Math.random()<.004){S.niao++;if(!quiet)line('方','法：先以童便洗之，而后敷药。',87,1);}
  if(Math.random()<.10){S.dog++;if(!quiet)line('琐记','是日所养之犬死，埋在梅树下。',2671,1);}
  if(Math.random()<.25){S.kill++;if(!quiet)line('事','有人当街拦住他，要他偿命。他问：“谁家的？”那人答不上来。他便走了过去。',9623,1);}
  if(Math.random()<.10){S.shoe++;if(!quiet)line('晨三','起身时先找鞋，找了半日。',4569,1);}
  if(dt.yr>=33&&dt.yr<=38&&Math.random()<.30){
    S.zhu++;
    if(!quiet){
      const no=1+Math.floor(Math.random()*900);
      const ay=pick(CASE.case_ay),ky=pick(CASE.case_ky),ku=pick(CASE.case_kou),
            pi=pick(CASE.case_pi),jie=pick(CASE.case_jie),wu=pick(CASE.case_wu);
      addLine('<span class="t">【案 第 '+no+' 号】</span><span class="x">案由：'+ay+'勘验：'+ky+'证物：'+wu+'</span>','case');
      addLine('<span class="t">沈策批</span><span class="x">'+pi+'　结案：'+jie+'</span>','case');
      if(S.zhu===1)addLine('（第一笔朱批。全书共有 900 卷这样批下去。）','sys');
    }
  }
}
function rollDay(quiet){
  roll('晨',quiet);roll('行止',quiet);roll('所见',quiet);
  roll(Math.random()<.5?'事':'事二',quiet);roll(Math.random()<.5?'记':'夜记',quiet);
  if(Math.random()<.32)roll('晨三',quiet);
  if(Math.random()<.55)roll('伤',quiet);else if(!quiet)line('伤','无伤，惟倦。',2815);
  if(Math.random()<.35)roll('附',quiet); if(Math.random()<.6)roll('梦',quiet);
  if(Math.random()<.25)roll('夜',quiet); if(Math.random()<.6)roll('札',quiet);
  if(Math.random()<.2)roll('问答',quiet); if(Math.random()<.2)roll('琐记',quiet);
  if(Math.random()<.15)roll('耳闻',quiet); if(Math.random()<.12)roll('言语',quiet);
  if(Math.random()<.08)roll('旧事',quiet);
}
function day(){
  if(S.day>=TOTAL_DAYS){return ending()}
  S.day++;const dt=dateOf(S.day);AGE=dt.age;lastDay=[];REC=true;
  addLine('<span style="flex:none">第 '+S.day.toLocaleString()+' 天</span><span class="x">'+dt.text+'</span>'
   +'<span class="c">米'+(28+Math.floor(Math.random()*59))+'·酒'+(3+Math.floor(Math.random()*12))+'</span>','day');
  extras(dt,false);
  if(dt.dd===10&&Math.random()<.34)addLine('〔初undefined〕这一天的日期，机器写不出来。','sys');
  if(Math.random()<.12)sfx('tick');
  rollDay(false);
  REC=false;checkMile();render();save();if(rawOn)renderRaw();
}
function month(){
  const left=Math.min(30,TOTAL_DAYS-S.day);if(left<=0)return ending();
  const b={};Object.keys(S).forEach(k=>b[k]=S[k]);
  for(let i=0;i<left;i++){S.day++;const dt=dateOf(S.day);AGE=dt.age;extras(dt,true);rollDay(true);if(S.day>=TOTAL_DAYS)break;}
  const dt=dateOf(S.day);
  const d=k=>S[k]-b[k];
  addLine('（跳过一个月 → '+dt.text+'）失火 +'+d('fire')+'　索命 +'+d('kill')+'　擦剑 +'+d('sword')
   +'　犬死 +'+d('dog')+'　童便 +'+d('niao')+'　找鞋 +'+d('shoe')+'　朱批 +'+d('zhu')+'　灰饭 +'+d('ash'),'sys');
  checkMile();render();save();if(rawOn)renderRaw();
  if(S.day>=TOTAL_DAYS)ending();
}
function year(){
  const left=Math.min(360,TOTAL_DAYS-S.day);if(left<=0)return ending();
  const b={};Object.keys(S).forEach(k=>b[k]=S[k]);
  for(let i=0;i<left;i++){S.day++;const dt=dateOf(S.day);AGE=dt.age;extras(dt,true);rollDay(true);if(S.day>=TOTAL_DAYS)break;}
  const dt=dateOf(S.day);
  const d=k=>S[k]-b[k];
  addLine('（跳过 '+left+' 天 → '+dt.text+'，'+num(dt.age)+'岁）失火 +'+d('fire')+'　索命 +'+d('kill')
   +'　擦剑 +'+d('sword')+'　梦母 +'+d('dream')+'　讣告 +'+d('obit')+'　苏氏 +'+d('su')
   +'　无从考 +'+d('noka')+'　犬死 +'+d('dog')+'　童便 +'+d('niao')+'　找鞋 +'+d('shoe')
   +'　朱批 +'+d('zhu')+'　挨踢 +'+d('kick')+'　抢馍 +'+d('bun')+'　灰饭 +'+d('ash'),'sys');
  checkMile();render();save();if(rawOn)renderRaw();
  if(S.day>=TOTAL_DAYS)ending();
}
function render(){
  const dt=dateOf(Math.max(1,S.day));
  dateEl.textContent=(S.day?dt.text+'　'+num(dt.age)+'岁':'永嘉十四年正月初一　四岁');
  const lf=document.getElementById('life');
  if(S.life>1){lf.style.display='inline-block';lf.textContent='第'+num(S.life)+'世'}else{lf.style.display='none'}
  barEl.style.width=(100*S.day/TOTAL_DAYS).toFixed(2)+'%';
  const cells=[['失火',S.fire],['索命',S.kill],['擦剑',S.sword],['梦母',S.dream],
               ['朱批',S.zhu],['讣告',S.obit],['苏氏',S.su],['无从考',S.noka],
               ['犬死',S.dog],['童便',S.niao],['断眉',S.mei],['找鞋',S.shoe],
               ['挨踢',S.kick],['抢馍',S.bun],['灰饭',S.ash],['天数',S.day],
               ['穿越',S.anachro],['熬夜',S.night],['数星',S.star],['持刀',S.hold],
               ['落水',S.plash],['问剑',S.ask],['下棋',S.chess],['喂狗',S.feed]];
  const zhuEl=document.getElementById('zhu'); if(zhuEl)zhuEl.textContent=S.zhu;
  const shown=statsOpen?cells:cells.slice(0,8);
  statsEl.innerHTML=shown.map(([a,b])=>'<div>'+a+'<b>'+b.toLocaleString()+'</b></div>').join('');
  const st=document.getElementById('statsToggle');
  if(st)st.textContent=statsOpen?'收起 ▴':'展开全部 24 项 ▾';
  const pl=document.getElementById('progLabel'),pb=document.getElementById('progBar');
  if(pl){
    if(statsOpen){pl.textContent='本页统计';pb.classList.remove('on')}
    else{
      pl.textContent='第 '+(S.day||0).toLocaleString()+' / '+TOTAL_DAYS.toLocaleString()+' 天';
      pb.classList.add('on');
      const inner=pb.firstChild; if(inner&&inner.style)inner.style.width=(100*(S.day||0)/TOTAL_DAYS).toFixed(2)+'%';
    }
  }
}
function seeded(n){let x=Math.sin(n*7919.13)*10000;return x-Math.floor(x)}
function renderRaw(){
  if(!rawOn)return;
  const d=Math.max(1,S.day),dt=dateOf(d);
  const pane=document.getElementById('rawpane');
  const tags=RAW_ORDER;
  let html='<div class="rawtitle">原文格式</div>'
    +'<div class="rawsub">第 '+d.toLocaleString()+' 天 · '+dt.text+' · 原书同日 32 行</div>';
  const used={};
  tags.forEach((tag,i)=>{
    const key=RAW_ALIAS[tag]||tag,p=POOL[key];if(!p||!p.length)return;
    let idx=Math.floor(seeded(d*31+i)*p.length)%p.length;
    for(let t=0;t<6&&used[key]&&used[key].has(idx);t++)idx=(idx+1)%p.length;
    (used[key]=used[key]||new Set()).add(idx);
    const e=p[idx];
    html+='<div class="ln raw"><span class="t">〔'+tag+'〕</span><span class="x">'+e.s+'</span><span class="c">×'+e.n+'</span></div>';
  });
  html+='<div class="rawtip">句子取自原书标签池，按原书顺序排列 · 再点「朱批」退出</div>';
  pane.innerHTML='<div class="rawbox">'+html+'</div>';
  pane.scrollTop=0;
}
function toggleRaw(){
  rawOn=!rawOn;
  const chip=document.getElementById('zhuChip');
  if(rawOn){
    document.body.classList.add('raw-on');
    chip.classList.add('rawbadge');chip.textContent='原文格式';
    logEl.style.display='none';
    document.getElementById('rawpane').classList.add('on');
    renderRaw();sfx('tick');
  }else{
    document.body.classList.remove('raw-on');
    chip.classList.remove('rawbadge');chip.innerHTML='朱批 <b id="zhu">'+(S.zhu||0)+'</b>';
    document.getElementById('rawpane').classList.remove('on');
    logEl.style.display='';
    if(lastDay.length){logEl.innerHTML=lastDay.join('');logEl.scrollTop=logEl.scrollHeight}
  }
  chip.title=rawOn?'再点一次退出原文格式':'看看原书那天写的什么';
}
function renderStory(){
  const c=STORY[stIdx];
  document.getElementById('st-title').textContent=c.t;
  document.getElementById('st-src').textContent=c.src;
  document.getElementById('st-idx').textContent=(stIdx+1)+' / '+STORY.length;
  const body=document.getElementById('st-body');
  body.innerHTML=c.p.map(x=>{
    if(/^【/.test(x))return '<p class="h">'+x+'</p>';
    if(/^[〔(]/.test(x))return '<p class="note">'+x+'</p>';
    return '<p>'+x+'</p>';
  }).join('')+'<p class="note">（以上为原书原文。原书没有连续剧情，只有这些。）</p>';
  body.scrollTop=0;
  try{localStorage.setItem('story_ch',stIdx)}catch(e){}
  document.getElementById('st-prev').disabled=stIdx===0;
  document.getElementById('st-next').disabled=stIdx===STORY.length-1;
}
function openStory(i){
  if(i!==undefined)stIdx=Math.max(0,Math.min(STORY.length-1,i));
  else{try{const v=localStorage.getItem('story_ch');if(v!==null)stIdx=Math.max(0,Math.min(STORY.length-1,+v))}catch(e){}}
  renderStory();document.getElementById('story').classList.add('on');document.body.classList.add('story-on');
}
document.getElementById('stampBtn').onclick=()=>openStory();
document.getElementById('st-exit').onclick=()=>{document.getElementById('story').classList.remove('on');document.body.classList.remove('story-on')};
document.getElementById('st-prev').onclick=()=>{if(stIdx>0){stIdx--;renderStory()}};
document.getElementById('st-next').onclick=()=>{if(stIdx<STORY.length-1){stIdx++;renderStory()}};
function ending(){sfx('end');
  popup('全书断更',
   '永嘉八十八年九月三十 —— 原书在这里断了，他那年只写了 <em>270</em> 天。<br><br>'+
   '你陪他过了 <em>'+S.day.toLocaleString()+'</em> 天：<br>'+
   '邻居失火 '+S.fire+' · 当街索命 '+S.kill+' · 擦剑 '+S.sword+'<br>'+
   '梦见母亲 '+S.dream+' · 梦见苏氏 '+S.su+' · 无从考 '+S.noka+'<br><br>'+

   '他 78 岁，没等到冬天。<br><br>'+
   '—— 你可以让他再活一次。',{rebirth:true});
}
document.getElementById('statsToggle').onclick=()=>{

  try{localStorage.setItem(KEY+'_stats',statsOpen?'1':'0')}catch(e){}

};
document.getElementById('zhuChip').onclick=toggleRaw;
document.getElementById('b1').onclick=day;
document.getElementById('b30').onclick=month;
document.getElementById('b360').onclick=year;
document.getElementById('bJoke').onclick=()=>{const j=pick(JOKES);popup('离谱数据',j[0]+'<br>'+j[1])};
document.getElementById('achi').onclick=()=>{

  html+='</div>';
  popup('成就墙 '+MILE.filter(unlocked).length+'/'+MILE.length,html,{ok:'关闭',reset:true,rebirth:true});

document.getElementById('bEv').onclick=()=>{
  popup('罪证',EV.map(([h,arr])=>'<h4>'+h+'</h4>'+arr.map(x=>'<p>· '+x+'</p>').join('')).join(''));
};
const resumed=load();
render();renderAchi();
if(resumed&&S.day>0){const d0=dateOf(S.day);
  addLine('（接上次：第 '+S.day.toLocaleString()+' 天，'+d0.text+'，'+num(d0.age)+'岁。存档在本机浏览器里。）','sys');}
else addLine('三、癖：夜半独坐擦剑；见雪必折一枝；逢月圆不眠。','sys');
addLine('（全书 26,910 天。点「过一天」开始，「过一月」快进，「罪证」看全部离谱数据。）','sys');
